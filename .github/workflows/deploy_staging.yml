name: Deploy — Staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  migrate-staging:
    name: Apply Migrations → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Credentials are passed via env: block — NEVER interpolated directly in run:
      - name: Link Supabase project (Staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }} # ADICIONADO AQUI
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }} 
        run: |
          supabase db push --yes --include-all

      - name: Deploy Edge Functions → Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          supabase secrets set RESEND_API_KEY="$RESEND_API_KEY"
          supabase functions deploy notify-invite --no-verify-jwt
          supabase functions deploy portal-submit-request --no-verify-jwt
          supabase functions deploy portal-finalize-upload --no-verify-jwt

  build-staging:
    name: Build Web (WASM) → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: migrate-staging
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Stub .env satisfies pubspec.yaml asset declaration.
      # Actual credentials come from --dart-define below.
      - name: Create stub .env
        run: echo "# CI stub — credentials injected via dart-define" > .env

      # Credentials injected via env: then referenced as $VAR to prevent log exposure
      - name: Build Web (Staging)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          flutter build web --wasm \
            --dart-define=ENV=staging \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_KEY="$POSTHOG_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST" \
            --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build-staging
          path: build/web/
          retention-days: 1