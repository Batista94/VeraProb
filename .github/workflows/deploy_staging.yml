name: Deploy — Staging

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  migrate-staging:
    name: Apply Migrations → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Credentials are passed via env: block — NEVER interpolated directly in run:
      - name: Push migrations to Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase db push --project-ref "$PROJECT_REF"

  build-staging:
    name: Build Web → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migrate-staging
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Stub .env satisfies pubspec.yaml asset declaration.
      # Actual credentials come from --dart-define below.
      - name: Create stub .env
        run: echo "# CI stub — credentials injected via dart-define" > .env

      # Credentials injected via env: then referenced as $VAR to prevent log exposure
      - name: Build Web (Staging)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web \
            --dart-define=ENV=staging \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY" \
            --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-staging
          path: build/web/
          retention-days: 7
