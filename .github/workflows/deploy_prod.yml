name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY-PROD to confirm production deployment"
        required: true
        default: ""
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # Never cancel an in-flight prod deploy

jobs:
  # ─────────────────────────────────────────────────────────
  # Guard: only allow explicit confirmation on manual trigger
  # ─────────────────────────────────────────────────────────
  guard:
    name: Manual Confirmation Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY-PROD" ]; then
            echo "❌ Confirmation does not match. Abort."
            exit 1
          fi
          echo "✅ Confirmation accepted. Proceeding to deploy."

  # ─────────────────────────────────────────────────────────
  # Gate: requires human approval via GitHub Environment
  # ─────────────────────────────────────────────────────────
  migrate-prod:
    name: Apply Migrations → Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [guard]
    if: always() && (needs.guard.result == 'success' || github.event_name == 'push')
    environment: production   # ← GitHub required_reviewers gate — blocks here

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project (Production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations to Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --yes

      - name: Deploy Edge Functions → Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          supabase secrets set RESEND_API_KEY="$RESEND_API_KEY"
          supabase functions deploy notify-invite --no-verify-jwt

  build-prod:
    name: Build Web → Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migrate-prod
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Create stub .env
        run: echo "# CI stub — credentials injected via dart-define" > .env

      - name: Build Web (Production)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          flutter build web \
            --dart-define=ENV=prod \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_KEY="$POSTHOG_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST" \
            --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-prod
          path: build/web/
          retention-days: 30
