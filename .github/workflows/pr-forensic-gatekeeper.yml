name: VeraProb Forensic Gatekeeper

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  forensic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Create dummy .env
        run: touch .env

      - name: Run Forensic Scanner
        run: |
          chmod +x scripts/security/*.sh
          BASE_BRANCH=${{ github.base_ref }} bash scripts/security/pr_full_scanner.sh
