name: CI — Analyze & Test

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-guard:
    name: Migration Append-Only Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect destructive DDL in new migrations
        run: |
          # Get list of new migration files added in this PR (not in base branch)
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD -- 'supabase/migrations/*.sql')
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migrations in this PR. PASS."
            exit 0
          fi
          echo "New migrations detected:"
          echo "$NEW_MIGRATIONS"
          VIOLATIONS=""
          for FILE in $NEW_MIGRATIONS; do
            # Check for destructive DDL (schema-level only, exclude comments)
            MATCHES=$(grep -inP '^\s*(DROP\s+TABLE|DROP\s+COLUMN|ALTER\s+TABLE\s+\S+\s+DROP\s+COLUMN|TRUNCATE\s+TABLE|TRUNCATE\s+\w)' "$FILE" || true)
            if [ -n "$MATCHES" ]; then
              VIOLATIONS="$VIOLATIONS\n--- $FILE (destructive DDL) ---\n$MATCHES"
            fi

            # INV-6: timestamp without time zone PROHIBITED — all timestamps must use TIMESTAMPTZ.
            TZ_MATCHES=$(grep -inE 'timestamp\s+without\s+time\s+zone' "$FILE" || true)
            if [ -n "$TZ_MATCHES" ]; then
              VIOLATIONS="$VIOLATIONS\n--- $FILE (INV-6: bare timestamp without TZ) ---\n$TZ_MATCHES"
            fi

            # INV-6: bare TIMESTAMP column type (not TIMESTAMPTZ / WITH TIME ZONE).
            BARE_MATCHES=$(grep -inE '\bTIMESTAMP\s+(NOT\s+NULL|DEFAULT\s|NULL\b)' "$FILE" | grep -ivE 'TIMESTAMPTZ|TIMESTAMP\s+WITH\s+TIME\s+ZONE' || true)
            if [ -n "$BARE_MATCHES" ]; then
              VIOLATIONS="$VIOLATIONS\n--- $FILE (INV-6: bare TIMESTAMP without TZ) ---\n$BARE_MATCHES"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo ""
            echo "::error::MIGRATION VIOLATION — Destructive DDL or forbidden timestamp type detected."
            echo "INV-6: Use TIMESTAMPTZ for all timestamps. INV-DB: No destructive DDL."
            echo "Requires Lead Reviewer [GO] verdict before merge."
            echo -e "$VIOLATIONS"
            exit 1
          fi
          echo "No destructive DDL or forbidden timestamp types detected. PASS."

  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Create a stub .env so the asset declaration in pubspec.yaml is satisfied.
      # Real credentials are injected via --dart-define at build time — never here.
      - name: Create stub .env for asset resolution
        run: echo "# CI stub — credentials injected via dart-define" > .env

      - name: Install dart_code_metrics
        run: |
          dart pub global activate dart_code_metrics
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Flutter Analyze (zero warnings policy)
        run: flutter analyze --no-pub

      - name: H-13 Encoding Guard (reject mojibake)
        run: |
          echo "Scanning all .dart files for encoding violations..."
          ERRORS=0
          while IFS= read -r FILE; do
            # Valid UTF-8 check
            if ! iconv -f UTF-8 -t UTF-8 "$FILE" > /dev/null 2>&1; then
              echo "::error file=$FILE::Invalid UTF-8 encoding"
              ERRORS=$((ERRORS + 1))
              continue
            fi
            # BOM check
            if head -c 3 "$FILE" | grep -qP '\xef\xbb\xbf'; then
              echo "::error file=$FILE::UTF-8 BOM detected (remove BOM)"
              ERRORS=$((ERRORS + 1))
            fi
            # Latin-1 double-encode
            if grep -qP '\xc3\x83\xc2' "$FILE"; then
              echo "::error file=$FILE::Mojibake detected (Latin-1 double-encode)"
              ERRORS=$((ERRORS + 1))
            fi
            # Win-1252 double-encode
            if grep -qP '\xc3\xa2\xe2\x82\xac' "$FILE"; then
              echo "::error file=$FILE::Mojibake detected (Win-1252 double-encode)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find lib test -name '*.dart' -type f)
          if [ $ERRORS -gt 0 ]; then
            echo "::error::Encoding Guard FAILED: $ERRORS file(s) with violations"
            exit 1
          fi
          echo "✅ All .dart files are valid UTF-8 without mojibake."

      - name: Enforce Dart Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Dependency Intelligence (Outdated Audit)
        run: flutter pub outdated

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: VeraProb Forensic Scan (H-03)
        run: |
          chmod +x scripts/security/pr_full_scanner.sh
          BASE_BRANCH="${{ github.base_ref || 'main' }}" bash scripts/security/pr_full_scanner.sh

      - name: Secret Scan (H-04)
        run: |
          python3 scripts/security/scan_secrets.py
        continue-on-error: false

      - name: Prompt Injection Audit (H-06)
        run: |
          # Placeholder for prompt-injection-auditor skill invocation
          # When skill system is available in CI, replace with actual scan
          echo "[H-06] Prompt Injection Audit — requires skill invocation (deferred to pre-commit hook)"

      - name: Index Advisor (H-11)
        run: |
          python3 scripts/index_advisor.py
        continue-on-error: true

      - name: Phase 3 — Environment Config Matrix
        run: |
          pwsh scripts/test/run_env_matrix.ps1

  test-coverage:
    name: "Test Coverage & E2E Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup supabase local environment secrets
        run: |
          HMAC_KEY=$(openssl rand -hex 16)
          echo "HMAC_SECRET_KEY_V1=$HMAC_KEY" >> $GITHUB_ENV
          echo "ENVIRONMENT=dev" > supabase/.env.local
          echo "HMAC_SECRET_KEY_V1=$HMAC_KEY" >> supabase/.env.local

      - name: Start Supabase Local
        run: supabase start

      - name: Create stub .env
        run: echo "# CI stub" > .env

      - name: Capture Supabase Keys
        run: |
          SERVICE_ROLE_KEY=$(supabase status -o env | grep SERVICE_ROLE_KEY | cut -d '=' -f 2- | tr -d '"' | tr -d '\r')
          ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d '=' -f 2- | tr -d '"' | tr -d '\r')
          
          if [ -z "$SERVICE_ROLE_KEY" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::Critical failure: Could not capture Supabase keys. Aborting CI."
            exit 1
          fi

          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV

      - name: Bootstrap Dev Data
        run: node scripts/dev/bootstrap_dev.mjs
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: JWT getClaims Integration (P0)
        run: make test-jwt-integration
        env:
          REQUIRE_JWT_INTEGRATION: "1"
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: pgTAP Forensic DB Tests
        run: make test-db

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Flutter Test (Unit/Widget) with Coverage
        run: |
          flutter test --no-pub -j 1 --coverage \
            --dart-define=ENV=dev \
            --dart-define=SUPABASE_URL="http://127.0.0.1:54321" \
            --dart-define=SUPABASE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            test/application test/compliance test/core test/domain test/features test/infrastructure test/presentation test/security test/smoke test/state test/utils test/validation test/widget
          mv coverage/lcov.info coverage/lcov_unit.info

      - name: Flutter Test (Integration) with Coverage
        run: |
          # Exclude test/integration/e2e/ SuperAdmin E2E because it requires a separate pipeline
          # with explicit SKIP_MFA_DEV=true and is not part of the normal integration coverage gate.
          INTEGRATION_FILES=$(find test/integration -name '*_test.dart' -not -path '*/e2e/*')
          flutter test --no-pub -j 1 --coverage \
            --dart-define=ENV=dev \
            --dart-define=SUPABASE_URL="http://127.0.0.1:54321" \
            --dart-define=SUPABASE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            $INTEGRATION_FILES
          mv coverage/lcov.info coverage/lcov_integration.info

      - name: Run SuperAdmin E2E
        run: |
          flutter test --no-pub -j 1 \
            --dart-define=SKIP_MFA_DEV=true \
            --dart-define=ENV=dev \
            --dart-define=SUPABASE_URL="http://127.0.0.1:54321" \
            --dart-define=SUPABASE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            test/integration/e2e/superadmin/

      - name: Merge Coverage Reports
        run: |
          lcov -a coverage/lcov_unit.info -a coverage/lcov_integration.info -o coverage/lcov.info

      - name: Remove generated files from coverage report
        run: |
          lcov --ignore-errors unused \
            --remove coverage/lcov.info \
            '*.g.dart' \
            '*.freezed.dart' \
            'lib/features/*' \
            'lib/presentation/*' \
            --output-file coverage/lcov_filtered.info

      - name: Enforce Coverage Gate (≥70%)
        uses: VeryGoodOpenSource/very_good_coverage@v3.0.0
        with:
          path: coverage/lcov_filtered.info
          min_coverage: 70

  wasm-build:
    name: WASM Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test-coverage

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Create stub .env
        run: echo "# CI stub — credentials injected via dart-define" > .env

      - name: WASM Build (dart2wasm target)
        run: |
          flutter build web --wasm --no-pub --release \
            --dart-define=ENV=ci_check

      - name: Verify WASM artifact present
        run: |
          if [ ! -f build/web/main.dart.wasm ]; then
            echo "::error::main.dart.wasm not found — WASM build did not produce expected output"
            exit 1
          fi
          echo "WASM artifact confirmed: $(du -h build/web/main.dart.wasm | cut -f1)"

      # - name: Upload WASM build artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: wasm-build-${{ github.sha }}
      #     path: build/web/
      #     retention-days: 1

  chaos-audit:
    name: Forensic Chaos & Resilience Audit
    runs-on: ubuntu-latest
    # Only run on PRs to main to ensure forensic integrity before merge
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: test-coverage
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js (for bootstrap)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Setup supabase local environment secrets
        run: |
          HMAC_KEY=$(openssl rand -hex 16)
          echo "HMAC_SECRET_KEY_V1=$HMAC_KEY" >> $GITHUB_ENV
          echo "ENVIRONMENT=dev" > supabase/.env.local
          echo "HMAC_SECRET_KEY_V1=$HMAC_KEY" >> supabase/.env.local
          
          WEBHOOK_KEY=$(openssl rand -hex 16)
          echo "WEBHOOK_SECRET=$WEBHOOK_KEY" >> $GITHUB_ENV
          echo "TELEGRAM_WEBHOOK_SECRET=$WEBHOOK_KEY" >> supabase/.env.local

      - name: Start Supabase
        run: supabase start

      - name: Wait for Supabase to be ready
        run: |
          RETRY_COUNT=0
          MAX_RETRIES=15
          RETRY_DELAY=2
          
          echo "⏳ Waiting for Supabase API to respond..."
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:54321/rest/v1/")
            
            if [[ "$HTTP_STATUS" =~ ^[23][0-9]{2}$ ]]; then
              echo "✅ Supabase API is ready (HTTP $HTTP_STATUS)"
              exit 0
            fi
            
            echo "  Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: API returned HTTP $HTTP_STATUS, retrying in ${RETRY_DELAY}s..."
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep $RETRY_DELAY
          done
          
          echo "::error::Supabase API did not become ready after $((MAX_RETRIES * RETRY_DELAY))s"
          exit 1

      - name: Bootstrap Forensic Data
        run: |
          npm install @supabase/supabase-js
          node scripts/dev/bootstrap_dev.mjs
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"

      - name: Apply Stress Limits (INV-16)
        run: bash scripts/qa/chaos/apply_stress_limits.sh

      - name: Run Chaos & Resilience Suite
        run: |
          # Capture keys dynamically from local stack
          SERVICE_ROLE_KEY=$(supabase status -o env | grep SERVICE_ROLE_KEY | cut -d '=' -f 2- | tr -d '"' | tr -d '\r')
          ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d '=' -f 2- | tr -d '"' | tr -d '\r')
          
          if [ -z "$SERVICE_ROLE_KEY" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::Critical failure: Could not capture Supabase keys. Aborting CI."
            exit 1
          fi

          export SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_URL="http://127.0.0.1:54321"
          export ORG_ID="00000000-0000-0000-0000-000000000001"
          export CONTRACT_ID="00000000-0000-0000-0000-ca0000000001"
          export BOUND_CHAT_ID="908453789"
          # WEBHOOK_SECRET is dynamically generated in Setup step and loaded from GITHUB_ENV

          bash scripts/qa/chaos/run_chaos_suite.sh
