# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "scratch/**"
  errors:
    # Treat missing return statements as errors, not warnings.
    missing_return: error
    # Treat dead code as a warning (not an error, to avoid blocking builds).
    dead_code: warning
    # --- Clean Code Enforcements ---
    unused_import: error
    unnecessary_underscores: error
    unused_local_variable: error

  # ── Strict Mode (INV-7: Type Sovereignty) ────────────────────────────────────
  # Enabled globally for domain, application, features, and state layers.
  # Infrastructure layer has a temporary per-directory exemption at
  # lib/infrastructure/analysis_options.yaml (~80 Map<dynamic,dynamic> cast
  # violations from Supabase/PostgreSQL JSON responses; fix via
  # scripts/audit_dynamic_types.sh, then delete that file).
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ── Safety ──────────────────────────────────────────────────────────────
    # Never use print() in production code — use a structured logger instead.
    avoid_print: true

    # Catch unawaited Futures — a common source of silent bugs where async
    # operations are fire-and-forget when they should be awaited.
    unawaited_futures: true

    # ── Style / Correctness ─────────────────────────────────────────────────
    # Use const constructors wherever possible (reduces widget rebuild cost).
    prefer_const_constructors: true
    prefer_const_declarations: true

    # Prefer super-parameter syntax (cleaner, less boilerplate constructors).
    use_super_parameters: true

    # Enforce explicit return types on all public APIs.
    always_declare_return_types: true

    # Enforce that every enum switch is exhaustive — catches missing cases
    # when a new enum value is added later.
    exhaustive_cases: true

    # ── SRP & Architecture Enforcement (feeds Pillar B1 + C4 of pr_full_scanner.sh) ──
    #
    # These rules offload basic SRP and presentation-layer hygiene to the static
    # analyzer, so the LLM neural review (Step 1) can focus on deeper reasoning.

    # NOTE: "methods that return Widget" (SRP violation) cannot be enforced by the
    # static analyzer — it is caught by the LLM neural review (Step 1, Lens 1).

    # Prevents logic in StatefulWidget.createState() — enforces SRP boundary
    # between Widget construction and business logic.
    no_logic_in_create_state: true

    # Catches BuildContext usage across async gaps — prevents silent UI bugs
    # caused by context being disposed between await calls.
    use_build_context_synchronously: true

    # Flags unnecessary Container wrappers that obscure layer intent and add
    # visual noise without semantic value.
    avoid_unnecessary_containers: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
