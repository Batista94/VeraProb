name: veraprob
description: "VeraProb: Veracity & Probative SLA Audit Engine"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.12.0
  flutter_map: ^8.2.2
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.1
  equatable: ^2.0.5
  flutter_map_marker_cluster: any
  flutter_tts: ^3.8.3
  fl_chart: ^0.66.2
  flutter_local_notifications: ^17.0.0
  collection: ^1.19.1
  intl: 0.20.2
  uuid: ^4.5.3
  crypto: ^3.0.7
  timezone: ^0.9.4
  flutter_dotenv: ^6.0.0
  csv: ^7.2.0
  pdf: ^3.11.3
  http: ^1.6.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  universal_html: ^2.3.0
  file_saver: ^0.3.1
  # ── 8.4 Observabilidade ─────────────────────────────
  sentry_flutter: ^9.15.0
  posthog_flutter: ^5.20.0
  web: ^1.1.0

dev_dependencies:
  sentry_dart_plugin: ^3.2.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 8.4 Observabilidade
  assets:
    - .env

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: veraprob
  org: veraprob
